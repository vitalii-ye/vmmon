name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags "-s -w" -o vmmon-${{ matrix.arch }} ./cmd/vmmon
      - name: Check it is static and within the size target
        run: |
          file vmmon-${{ matrix.arch }} | grep -q 'statically linked'
          test "$(stat -c %s vmmon-${{ matrix.arch }})" -lt 26214400
      - uses: actions/upload-artifact@v4
        with:
          name: vmmon-${{ matrix.arch }}
          path: vmmon-${{ matrix.arch }}
