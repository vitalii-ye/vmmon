name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags "-s -w" -o vmmon-${{ matrix.arch }} ./cmd/vmmon
      - name: Check it is static and within the size target
        run: |
          file vmmon-${{ matrix.arch }} | grep -q 'statically linked'
          test "$(stat -c %s vmmon-${{ matrix.arch }})" -lt 26214400
      - uses: actions/upload-artifact@v4
        with:
          name: vmmon-${{ matrix.arch }}
          path: vmmon-${{ matrix.arch }}

  packaging-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck -s sh packaging/*.sh packaging/deb/* testdata/integration/*.sh
      - name: Test install.sh
        run: sh packaging/test_install.sh
      - name: Test the .deb maintainer scripts
        run: sh packaging/test_deb_scripts.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the goreleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Check the tarball has what install.sh extracts
        run: |
          for arch in amd64 arm64; do
            members="$(tar -tzf "dist/vmmon_linux_$arch.tar.gz" | LC_ALL=C sort | tr '\n' ' ')"
            test "$members" = "LICENSE README.md vmmon vmmon.service "
          done
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/checksums.txt
          if-no-files-found: error

  # The release artifacts inside each supported distro. amd64 only, as the runners are: ARCH below.
  integration:
    needs: package
    runs-on: ubuntu-latest
    env:
      ARCH: amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            ecosystem: Debian:13
          - image: ubuntu:24.04
            ecosystem: Ubuntu:24.04:LTS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: dist
      - name: Extract the binary from the release tarball
        run: |
          mkdir -p it
          tar -xzf "dist/vmmon_linux_$ARCH.tar.gz" -C it vmmon
          file it/vmmon | grep -q 'statically linked'
      - name: Build the fixture databases
        env:
          VMMON_IT_STATE: ${{ runner.temp }}/vmmon-state
        run: go test ./testdata/integration -run TestBuildFixtures -count=1
      - name: Run version, inventory and scan in the container
        run: sh testdata/integration/run.sh "${{ matrix.image }}" "${{ matrix.ecosystem }}" it/vmmon "${{ runner.temp }}/vmmon-state" "$ARCH"
      - name: Install, remove and purge the .deb in the container
        run: |
          docker run --rm --platform "linux/$ARCH" \
            -v "$PWD/dist/vmmon_linux_$ARCH.deb:/vmmon.deb:ro" \
            -v "$PWD/testdata/integration/deb.sh:/deb.sh:ro" \
            "${{ matrix.image }}" sh /deb.sh /vmmon.deb

  # The .deb on a real OS with systemd, under QEMU (VOQ-39). amd64 only.
  #
  # Runs on a GitHub-hosted runner: standard Linux runners of public repositories expose
  # /dev/kvm, and each job gets a disposable VM, so pull_request is safe here (no
  # self-hosted runner, no secrets). The job needs the repository to be public for KVM;
  # vm.sh is run with VM_REQUIRE_KVM=1 so a runner without KVM fails instead of crawling.
  integration-vm:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-13
            image: debian-13-genericcloud-amd64.qcow2
            base_url: https://cloud.debian.org/images/cloud/trixie/latest
            sums: SHA512SUMS
            sumtool: sha512sum
          - name: ubuntu-24.04
            image: noble-server-cloudimg-amd64.img
            base_url: https://cloud-images.ubuntu.com/noble/current
            sums: SHA256SUMS
            sumtool: sha256sum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: dist
      # The cache key rolls monthly so the "latest" images are refreshed; the checksum
      # below is checked against the published list either way.
      - name: Month for the image cache key
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: vm-images
          key: vm-image-${{ matrix.name }}-${{ steps.month.outputs.month }}
      - name: Fetch and verify the base image
        run: |
          mkdir -p vm-images
          cd vm-images
          curl -fsSL -o "${{ matrix.sums }}" "${{ matrix.base_url }}/${{ matrix.sums }}"
          grep "[ *]${{ matrix.image }}\$" "${{ matrix.sums }}" > "${{ matrix.image }}.sum"
          test -s "${{ matrix.image }}.sum"
          if ! ${{ matrix.sumtool }} -c "${{ matrix.image }}.sum" >/dev/null 2>&1; then
            curl -fsSL -o "${{ matrix.image }}" "${{ matrix.base_url }}/${{ matrix.image }}"
            ${{ matrix.sumtool }} -c "${{ matrix.image }}.sum"
          fi
      - name: Install QEMU and enable KVM for the runner user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: Boot the image and run the .deb checks
        env:
          VM_REQUIRE_KVM: "1"
        run: sh testdata/integration/vm.sh "vm-images/${{ matrix.image }}" dist/vmmon_linux_amd64.deb
