version: "3"

vars:
  LDFLAGS: -s -w -X github.com/vitalii-ye/vmmon/internal/buildinfo.Version={{.VERSION | default "dev"}}

tasks:
  build:
    desc: Build a static binary for the local platform
    env: { CGO_ENABLED: "0" }
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/vmmon ./cmd/vmmon
  build:linux:
    desc: Build static Linux binaries for amd64 and arm64
    env: { CGO_ENABLED: "0", GOOS: linux }
    cmds:
      - GOARCH=amd64 go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/vmmon-linux-amd64 ./cmd/vmmon
      - GOARCH=arm64 go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/vmmon-linux-arm64 ./cmd/vmmon
  test:
    desc: Run unit tests
    cmds:
      - go test -race ./...
  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run
  test:packaging:
    desc: Lint and test install.sh and the .deb maintainer scripts
    cmds:
      - shellcheck -s sh packaging/*.sh packaging/deb/* testdata/integration/*.sh
      - sh packaging/test_install.sh
      - sh packaging/test_deb_scripts.sh
  test:integration:
    desc: Run a snapshot's binary and .deb in each supported distro (needs Docker and `task snapshot`; ARCH=amd64|arm64 overrides the host's arch)
    env: { VMMON_IT_STATE: "{{.ROOT_DIR}}/dist/it-state" }
    cmds:
      - go test ./testdata/integration -run TestBuildFixtures -count=1
      - mkdir -p dist/it && tar -xzf dist/vmmon_linux_{{.ARCH}}.tar.gz -C dist/it vmmon
      - for: { var: IMAGES, split: " " }
        cmd: |
          set -- $(echo "{{.ITEM}}" | tr '=' ' ')
          sh testdata/integration/run.sh "$1" "$2" dist/it/vmmon "$VMMON_IT_STATE" {{.ARCH}}
          docker run --rm --platform linux/{{.ARCH}} -v "$PWD/dist/vmmon_linux_{{.ARCH}}.deb:/vmmon.deb:ro" -v "$PWD/testdata/integration/deb.sh:/deb.sh:ro" "$1" sh /deb.sh /vmmon.deb
    vars:
      HOST_ARCH: { sh: go env GOARCH }
      # Task-level vars beat CLI vars, so default keeps `ARCH=amd64` on the command line working.
      ARCH: '{{.ARCH | default .HOST_ARCH}}'
      IMAGES: debian:13=Debian:13 ubuntu:24.04=Ubuntu:24.04:LTS
  snapshot:
    desc: Build a local goreleaser snapshot into dist/, publishing nothing
    cmds:
      - goreleaser check
      - goreleaser release --snapshot --clean --skip=publish
  package:
    desc: Build a snapshot and list what a .deb and a tarball contain
    deps: [snapshot]
    cmds:
      - mkdir -p dist/deb-amd64 && cd dist/deb-amd64 && ar x ../vmmon_linux_amd64.deb && tar -tzf data.tar.gz
      - tar -tzf dist/vmmon_linux_amd64.tar.gz
      - ls -l dist/*.deb dist/*.tar.gz
